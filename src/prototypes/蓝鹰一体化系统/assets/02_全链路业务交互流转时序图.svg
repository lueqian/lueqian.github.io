<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 980" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <linearGradient id="grad-head" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <!-- 顶部标题 -->
  <rect x="30" y="20" width="1040" height="54" rx="8" fill="url(#grad-head)" filter="url(#shadow2)"/>
  <text x="50" y="53" fill="#ffffff" font-size="18" font-weight="700">蓝鹰一体化系统 · 全链路业务交互与跨网流转时序图</text>
  <text x="790" y="52" fill="#93c5fd" font-size="13">跨租户直报 / 智能下发 / 扁平闭环时序</text>

  <!-- 4 个角色列头卡片 -->
  <!-- 1. 区县基层网安 -->
  <rect x="60" y="90" width="200" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="160" y="112" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle">区县基层网安大队</text>
  <text x="160" y="128" fill="#3b82f6" font-size="11" text-anchor="middle">(贾汪分局 · 李四)</text>

  <!-- 2. 市局独立系统 -->
  <rect x="320" y="90" width="200" height="48" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="420" y="112" fill="#166534" font-size="13" font-weight="700" text-anchor="middle">市局独立采购系统</text>
  <text x="420" y="128" fill="#16a34a" font-size="11" text-anchor="middle">(徐州市局 · 张三)</text>

  <!-- 3. 蓝鹰智控路由网关 -->
  <rect x="580" y="90" width="200" height="48" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="680" y="112" fill="#6b21a8" font-size="13" font-weight="700" text-anchor="middle">蓝鹰智控路由网关</text>
  <text x="680" y="128" fill="#9333ea" font-size="11" text-anchor="middle">(跨网路由与安全隔离通道)</text>

  <!-- 4. 省厅统筹平台 -->
  <rect x="840" y="90" width="200" height="48" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="940" y="112" fill="#991b1b" font-size="13" font-weight="700" text-anchor="middle">省厅统筹平台</text>
  <text x="940" y="128" fill="#dc2626" font-size="11" text-anchor="middle">(江苏总队 · 值班长)</text>

  <!-- 泳道垂直虚线 -->
  <line x1="160" y1="140" x2="160" y2="920" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="420" y1="140" x2="420" y2="920" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="680" y1="140" x2="680" y2="920" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="940" y1="140" x2="940" y2="920" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- ================= 分区 1：区县手工上报流 ================= -->
  <rect x="50" y="155" width="1000" height="195" rx="6" fill="#f1f5f9" fill-opacity="0.6" stroke="#cbd5e1"/>
  <text x="70" y="174" fill="#475569" font-size="12" font-weight="700">【阶段 1】区县手工填报、省厅13地市字典激活与审批/免审双轨流转</text>

  <!-- 1. 手工填报 -->
  <line x1="160" y1="195" x2="420" y2="195" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="190" y="180" width="200" height="22" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="290" y="195" fill="#1e40af" font-size="11" text-anchor="middle">1. 填报舆情，勾选【上报总队】</text>

  <!-- 2a. 审批分支 -->
  <rect x="230" y="215" width="380" height="52" rx="4" fill="#fffbeb" stroke="#fde68a"/>
  <text x="240" y="233" fill="#92400e" font-size="11" font-weight="600">[分支 A: 开启审批] 拦截暂扣市局【上报审核】池</text>
  <line x1="420" y1="248" x2="680" y2="248" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="540" y="244" fill="#b45309" font-size="10" text-anchor="middle">2a. 市局审批通过放行 ➔</text>

  <!-- 2b. 免审直通分支 -->
  <line x1="160" y1="285" x2="680" y2="285" stroke="#059669" stroke-width="2" marker-end="url(#arrow-emerald)"/>
  <rect x="260" y="274" width="320" height="22" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="420" y="289" fill="#065f46" font-size="11" text-anchor="middle">[分支 B: 免审直通] 2b. 秒级跨网摆渡通道 ➔</text>

  <!-- 3. 落库省厅 -->
  <line x1="680" y1="315" x2="940" y2="315" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="710" y="304" width="200" height="22" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="810" y="319" fill="#1e40af" font-size="11" text-anchor="middle">3. 落库省厅【区县上报】中心库</text>

  <!-- ================= 分区 2：省厅研判与精准下达 ================= -->
  <rect x="50" y="365" width="1000" height="195" rx="6" fill="#f1f5f9" fill-opacity="0.6" stroke="#cbd5e1"/>
  <text x="70" y="384" fill="#475569" font-size="12" font-weight="700">【阶段 2】省厅研判、轻量化自描述数据包下发 (排除音视频大附件) 与路由寻址</text>

  <!-- 4. 省厅研判 -->
  <rect x="830" y="398" width="210" height="32" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="935" y="418" fill="#1e40af" font-size="11" text-anchor="middle">4. AI辅助研判、点击下达指令 (计入考评)</text>

  <!-- 5. 下达选择部门 -->
  <line x1="940" y1="445" x2="680" y2="445" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="705" y="434" width="210" height="22" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="810" y="449" fill="#1e40af" font-size="11" text-anchor="middle">5. 选接收部门【徐州市】(Schema v2.4)</text>

  <!-- 6. 路由匹配 -->
  <rect x="560" y="468" width="240" height="32" rx="4" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="680" y="488" fill="#6b21a8" font-size="11" text-anchor="middle">6. 匹配：关联部门 == 徐州市 ➔ 徐州市公安局</text>

  <!-- 7. 注入市局待办 -->
  <line x1="680" y1="515" x2="420" y2="515" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="440" y="504" width="220" height="22" rx="4" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="550" y="519" fill="#6b21a8" font-size="11" text-anchor="middle">7. 注入 [跨租户接收岗] 待办池</text>

  <!-- 8. 触发通知 -->
  <rect x="330" y="532" width="180" height="24" rx="4" fill="#ffedd5" stroke="#fdba74"/>
  <text x="420" y="548" fill="#9a3412" font-size="10" font-weight="600" text-anchor="middle">8. 弹出桌面通知 + 标题红点 🔴 1</text>

  <!-- ================= 分区 3：市局协同与区县承办 ================= -->
  <rect x="50" y="575" width="1000" height="185" rx="6" fill="#f1f5f9" fill-opacity="0.6" stroke="#cbd5e1"/>
  <text x="70" y="594" fill="#475569" font-size="12" font-weight="700">【阶段 3】市局处置双轨流转：直接自办闭环 vs 极简转派区县基层承办</text>

  <!-- 9a. 市局自办 -->
  <rect x="290" y="608" width="260" height="40" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="420" y="625" fill="#065f46" font-size="11" font-weight="600" text-anchor="middle">[路径 A: 自办] 签收 ➔ 提交自办报告</text>
  <text x="420" y="640" fill="#047857" font-size="10" text-anchor="middle">(Toast: 签收成功！/ 提交成功！)</text>

  <!-- 9b. 转派区县 -->
  <line x1="420" y1="665" x2="160" y2="665" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="190" y="654" width="200" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="290" y="669" fill="#1e40af" font-size="11" text-anchor="middle">9b. 仅选部门 [贾汪分局网安大队]</text>

  <!-- 10. 区县签收 -->
  <rect x="70" y="685" width="180" height="32" rx="4" fill="#ffffff" stroke="#93c5fd"/>
  <text x="160" y="700" fill="#1e40af" font-size="10" text-anchor="middle">10. 标题红点 🔴 1 引导</text>
  <text x="160" y="712" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">李四点击【签收办理】(签收成功！)</text>

  <!-- 11. 线下核查 -->
  <text x="160" y="745" fill="#64748b" font-size="11" text-anchor="middle">11. 会同派出所上门核查、笔录取证</text>

  <!-- ================= 分区 4：单向直报省厅结案闭环 ================= -->
  <rect x="50" y="775" width="1000" height="145" rx="6" fill="#fef2f2" fill-opacity="0.6" stroke="#fecaca"/>
  <text x="70" y="794" fill="#991b1b" font-size="12" font-weight="700">【阶段 4】区县单向跨网直通省厅结案闭环 (市局彻底免审免确认)</text>

  <!-- 12. 单向直报省厅 -->
  <path d="M 160 815 L 940 815" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="420" y="802" width="260" height="26" rx="4" fill="#fee2e2" stroke="#ef4444"/>
  <text x="550" y="819" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle">12. 提交反馈 ➔ 单向跨网直通省厅结案！</text>

  <!-- 13. 市局置灰收尾 -->
  <rect x="310" y="840" width="220" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="420" y="855" fill="#475569" font-size="10" text-anchor="middle">13. ★ 市局免审免确认！</text>
  <text x="420" y="868" fill="#64748b" font-size="10" text-anchor="middle">状态置灰：[区县已直报省厅结案]</text>

  <!-- 14. 省厅终审 -->
  <rect x="850" y="840" width="180" height="34" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="940" y="855" fill="#065f46" font-size="10" font-weight="600" text-anchor="middle">14. 省厅发起方查验</text>
  <text x="940" y="868" fill="#047857" font-size="10" text-anchor="middle">点击【确认办结】全链路归档</text>

  <!-- 15. 全链路闭环完成 -->
  <line x1="940" y1="895" x2="160" y2="895" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-emerald)"/>
  <text x="550" y="890" fill="#15803d" font-size="11" font-weight="600" text-anchor="middle">15. 全链路业务闭环达成 (状态广播归档)</text>
</svg>