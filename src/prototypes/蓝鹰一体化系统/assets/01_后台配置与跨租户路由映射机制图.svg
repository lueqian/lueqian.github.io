<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c" />
    </marker>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- 主标题 -->
  <rect x="30" y="20" width="1040" height="54" rx="8" fill="url(#grad-blue)" filter="url(#shadow)"/>
  <text x="50" y="53" fill="#ffffff" font-size="18" font-weight="700">蓝鹰一体化系统 · 后台配置与跨租户路由映射机制全景图</text>
  <text x="820" y="52" fill="#bfdbfe" font-size="13">数据架构与流转拓扑规范 v2.4</text>

  <!-- ================= 阶段一：后台基础配置 ================= -->
  <rect x="30" y="95" width="1040" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="95" width="1040" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="30" y="121" width="1040" height="10" fill="#f1f5f9"/>
  <text x="48" y="119" fill="#1e293b" font-size="14" font-weight="700">【阶段一】后台基础配置与映射构建 (管理后台 / 系统设置)</text>

  <!-- 卡片 1: 客户管理 -->
  <rect x="50" y="145" width="280" height="150" rx="6" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="50" y="145" width="280" height="28" rx="6" fill="#eff6ff"/>
  <text x="62" y="164" fill="#1d4ed8" font-size="13" font-weight="600">1. 客户管理 (Customer)</text>
  <text x="65" y="195" fill="#334155" font-size="12">• 编辑独立客户：徐州市公安局</text>
  <text x="65" y="218" fill="#334155" font-size="12">• 挂载上级客户：JSga (省厅平台)</text>
  <rect x="65" y="235" width="250" height="46" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="75" y="253" fill="#1e40af" font-size="12" font-weight="600">核心配置项：【关联部门】</text>
  <text x="75" y="271" fill="#1d4ed8" font-size="11">单选绑定省厅部门树节点：徐州市</text>

  <!-- 卡片 2: 岗位权限 -->
  <rect x="360" y="145" width="310" height="150" rx="6" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="360" y="145" width="310" height="28" rx="6" fill="#eff6ff"/>
  <text x="372" y="164" fill="#1d4ed8" font-size="13" font-weight="600">2. 岗位管理 (Post 权限配置树)</text>
  <text x="375" y="195" fill="#334155" font-size="12">• 市局网安支队岗位：</text>
  <text x="390" y="215" fill="#2563eb" font-size="11" font-weight="600">勾选 [跨租户指令接收权限] ➔ 注入张三待办</text>
  <text x="375" y="242" fill="#334155" font-size="12">• 区县基层大队岗位：</text>
  <text x="390" y="262" fill="#2563eb" font-size="11" font-weight="600">勾选 [下级单位指令接收] ➔ 注入李四待办</text>

  <!-- 卡片 3: 工作平台定制配置 -->
  <rect x="700" y="145" width="350" height="150" rx="6" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="700" y="145" width="350" height="28" rx="6" fill="#eff6ff"/>
  <text x="712" y="164" fill="#1d4ed8" font-size="13" font-weight="600">3. 平台定制配置 (Toolbox 工具箱)</text>
  <text x="715" y="195" fill="#334155" font-size="12">• 策略开关：[上报总队审批] 复选框</text>
  <rect x="715" y="212" width="155" height="68" rx="4" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="725" y="232" fill="#065f46" font-size="11" font-weight="600">未勾选审批策略：</text>
  <text x="725" y="252" fill="#047857" font-size="11">基层上报免审直通省厅</text>
  <text x="725" y="268" fill="#059669" font-size="10">(秒级直通省厅中心库)</text>

  <rect x="880" y="212" width="155" height="68" rx="4" fill="#fffbeb" stroke="#fde68a"/>
  <text x="890" y="232" fill="#92400e" font-size="11" font-weight="600">勾选审批策略：</text>
  <text x="890" y="252" fill="#b45309" font-size="11">必须选择市局审批人</text>
  <text x="890" y="268" fill="#d97706" font-size="10">(暂扣市局前置审核池)</text>

  <!-- 连线：阶段一向阶段二 -->
  <line x1="190" y1="295" x2="190" y2="340" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <line x1="515" y1="295" x2="515" y2="340" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <line x1="875" y1="295" x2="875" y2="340" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- ================= 阶段二：区县上报与省厅下达 ================= -->
  <rect x="30" y="340" width="1040" height="240" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="340" width="1040" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="30" y="366" width="1040" height="10" fill="#f1f5f9"/>
  <text x="48" y="364" fill="#1e293b" font-size="14" font-weight="700">【阶段二】数据双向流转：区县跨租户上报与省厅自描述指令下发</text>

  <!-- 左侧：区县上报流 -->
  <rect x="50" y="390" width="460" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="65" y="412" fill="#0f172a" font-size="13" font-weight="700">A. 区县基层手工上报 (源头防控)</text>
  <text x="65" y="435" fill="#475569" font-size="12">1. 填报舆情，勾选【上报支队】+【上报总队】</text>
  <text x="65" y="455" fill="#2563eb" font-size="11">➔ 属地字典自动平滑切换为省厅 13 地市标准字典</text>
  <text x="65" y="478" fill="#475569" font-size="12">2. 审批分支流转：</text>
  <text x="80" y="498" fill="#059669" font-size="11">• 免审模式：直接跨网单向安全摆渡 ➔ 省厅【区县上报】中心库</text>
  <text x="80" y="518" fill="#d97706" font-size="11">• 审批模式：暂扣市局【上报审核】池 ➔ 市局审批放行后入库省厅</text>
  <text x="65" y="542" fill="#7c3aed" font-size="11">3. 跨市镜像：若勾选通报地市 (如连云港) ➔ 镜像推送其【通报信息】</text>

  <!-- 中间：智控路由引擎 -->
  <circle cx="550" cy="475" r="32" fill="#1e40af" filter="url(#shadow)"/>
  <text x="532" y="472" fill="#ffffff" font-size="11" font-weight="700">蓝鹰智控</text>
  <text x="532" y="487" fill="#93c5fd" font-size="10">路由引擎</text>

  <!-- 右侧：省厅指令下发流 -->
  <rect x="610" y="390" width="440" height="170" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="625" y="412" fill="#0f172a" font-size="13" font-weight="700">B. 省厅跨租户指令精准下达 (监测预警)</text>
  <text x="625" y="435" fill="#475569" font-size="12">1. 省厅总队值班长研判舆情，点击【下达处置指令】(计入采纳考评)</text>
  <text x="625" y="455" fill="#475569" font-size="12">2. 选择目标部门：选择省厅部门树中的【徐州市】</text>
  <rect x="625" y="468" width="410" height="42" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="635" y="486" fill="#1e40af" font-size="11" font-weight="600">3. 寻址命中：关联部门 == 徐州市 ➔ 精准路由徐州市公安局</text>
  <text x="635" y="502" fill="#2563eb" font-size="10">打包 Schema v2.4 纯文本轻量载荷 (免大附件，规避徐州网闸20MB限制)</text>
  <text x="625" y="530" fill="#475569" font-size="12">4. 下发落库：直接注入徐州市局具有【跨租户指令接收权限】的待办池</text>
  <text x="625" y="548" fill="#ea580c" font-size="11" font-weight="600">➔ 触发市局右上角 Notification 桌面通知 + 任务列表角标 🔴 1</text>

  <!-- 连线：阶段二向阶段三 -->
  <line x1="550" y1="580" x2="550" y2="615" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ================= 阶段三：市局协同与直报省厅闭环 ================= -->
  <rect x="30" y="615" width="1040" height="225" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="615" width="1040" height="36" rx="10" fill="#f1f5f9"/>
  <rect x="30" y="641" width="1040" height="10" fill="#f1f5f9"/>
  <text x="48" y="639" fill="#1e293b" font-size="14" font-weight="700">【阶段三】应急处置闭环：市局双轨流转 (自办 vs 转派) 与区县单向直报省厅免审</text>

  <!-- 市局双轨分流 -->
  <rect x="50" y="665" width="450" height="155" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="65" y="688" fill="#1e293b" font-size="13" font-weight="700">市局应急处置【总队指令】队列 (张三 · 支队接收岗)</text>
  <text x="65" y="708" fill="#475569" font-size="12">• 任务列表标题集成：[任务列表 - 本地舆情 | 总队指令 (🔴 1)]</text>
  <text x="65" y="728" fill="#475569" font-size="12">• 界面双模视图：支持 [文章卡片] 与 [紧凑列表(Table)] 自由切换</text>

  <!-- 自办与转派分支框 -->
  <rect x="65" y="738" width="195" height="68" rx="4" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="75" y="756" fill="#065f46" font-size="11" font-weight="600">路径 A: 市局直接自办</text>
  <text x="75" y="774" fill="#047857" font-size="11">1. 点击【签收】(签收成功！)</text>
  <text x="75" y="792" fill="#047857" font-size="11">2. 点击【反馈】录入报告(提交成功！)</text>

  <rect x="275" y="738" width="210" height="68" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="285" y="756" fill="#1e40af" font-size="11" font-weight="600">路径 B: 转派下级区县 (极简)</text>
  <text x="285" y="774" fill="#1d4ed8" font-size="11">1. 点击【转派】仅选贾汪分局(无需选岗)</text>
  <text x="285" y="792" fill="#1d4ed8" font-size="11">2. 确认提交 (已转派成功！)</text>

  <!-- 连线向区县 -->
  <path d="M 485 770 L 535 770" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 区县承办与直报省厅 -->
  <rect x="545" y="665" width="505" height="155" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="688" fill="#1e293b" font-size="13" font-weight="700">区县基层承办与单向直报省厅闭环 (贾汪分局 · 李四)</text>
  <text x="560" y="710" fill="#475569" font-size="12">1. 李四登录系统，【任务列表 - 总队指令】红点 🔴 1 引导定位</text>
  <text x="560" y="730" fill="#475569" font-size="12">2. 点击【签收办理】锁定经办 (签收成功！) ➔ 线下落地核查取证</text>
  
  <rect x="560" y="742" width="470" height="64" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="575" y="762" fill="#991b1b" font-size="12" font-weight="700">3. 点击【信息编报/反馈】➔ 单向跨网直通省厅总队结案闭环！</text>
  <text x="575" y="782" fill="#b91c1c" font-size="11">★ 市局端彻底免审、免确认、免查看明细！市局状态同步置灰 [区县已直报省厅结案]</text>
  <text x="575" y="798" fill="#7f1d1d" font-size="10">★ 省厅发起方查验处置报告并终审办结，全链路闭环归档。</text>
</svg>